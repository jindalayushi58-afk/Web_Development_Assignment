<!DOCTYPE html>
<html>
<head>
    <title>Tasty Bites Restaurant</title>

    <style>
        body {
            background: #fff8e7;
            margin: 0;
            font-family: Georgia;
        }

        header {
            background: #b71919;
            color: white;
            text-align: center;
            padding: 5px;
        }

        .menu {
            width: 80%;
            margin: 12px auto;
            text-align: center;
        }

        h2 {
            color: darkred;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: orange;
            color: white;
        }

        td, th {
            border: 1px solid #aaa;
            padding: 3px;
        }

        .offer {
            background: #ffe1e5;
            color: #c22;
            text-align: center;
            padding: 5px;
            margin-top: 12px;
        }

        footer {
            background: #38201d;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

<header>
    <h2 style="color:white;">Tasty Bites Restaurant</h2>
    <small>Good Food Makes a Better Mood</small>
</header>

<div class="menu">
    <h2>Our Special Dishes</h2>

    <table>
        <tr>
            <th>Dish Name</th>
            <th>Type</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Margherita Pizza</td>
            <td>Veg</td>
            <td>₹249</td>
        </tr>

        <tr>
            <td>Paneer Butter Masala</td>
            <td>Veg</td>
            <td>₹279</td>
        </tr>

        <tr>
            <td>Chicken Biryani</td>
            <td>Non-Veg</td>
            <td>₹299</td>
        </tr>

        <tr>
            <td>Chocolate Brownie</td>
            <td>Dessert</td>
            <td>₹149</td>
        </tr>
    </table>

    <div class="offer">
        <h3>Visit Us & Enjoy Delicious Food!</h3>
    </div>
</div>

<footer>
    <span>Open Daily: 11 AM – 11 PM</span>
    <span>Thank You!</span>
</footer>

</body>
</html>
